# Config Render (New > Blueprint > choisir ce dépôt), ou à reprendre à la main dans Settings
services:
  - type: web
    name: planning-ynov
    runtime: node
    plan: free               # sans disque : les réglages de l'admin sont perdus à chaque redéploiement
    region: frankfurt
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: TZ
        value: Europe/Paris
      - key: ADMIN_USER
        value: peda-montpellier
      - key: ADMIN_PASSWORD_HASH
        sync: false          # npm run hash-password
      - key: SESSION_SECRET
        generateValue: true
      - key: SECRETS_KEY
        generateValue: true
      - key: DISPLAY_KEY
        generateValue: true
      # Connexion HyperPlanning, à remplir quand on aura l'accès (le site passe alors en mode réel tout seul)
      - key: HP_API_KEY
        sync: false          # mot de passe du Service Web
      - key: HP_USER
        sync: false          # utilisateur du Service Web
      - key: HP_URL
        sync: false          # ex : https://hp26.ynov.com/MON/hpsw/api/v1/
      - key: HP_TYPE
        value: official      # official (API REST) ou soap

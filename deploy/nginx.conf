# À placer dans /etc/nginx/sites-available/ puis activer. Remplacer le nom de domaine.
# Certificat HTTPS gratuit : sudo certbot --nginx -d planning.ynov-montpellier.fr
server {
    listen 80;
    server_name planning.ynov-montpellier.fr;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

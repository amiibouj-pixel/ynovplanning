# Config Render : New > Blueprint > choisir ce dépôt
services:
  - type: web
    name: cours-du-jour-ynov
    runtime: node
    plan: starter            # le disque persistant (réglages + clé API chiffrée) demande une offre payante
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: SECRETS_KEY
        generateValue: true
      - key: DISPLAY_KEY
        generateValue: true
      - key: ADMIN_USER
        value: peda-montpellier
      - key: ADMIN_PASSWORD_HASH
        sync: false          # à coller dans le tableau de bord Render (npm run hash-password)
